[project]
name = "adk-kyapay-demo"
version = "0.1.0"
description = "ADK KyaPay Payment Protocol Demo using kyapay_a2a package"
requires-python = ">=3.11,<3.14"
dependencies = [
    "a2a-sdk",
    "google-adk>=0.5.0",
    "click>=8.2.0",
    "httpx>=0.28.1",
    "uvicorn>=0.34.2",
    "kyapay-a2a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["server", "client"]

[project.scripts]
server = "server.__main__:main"

[tool.uv.workspace]
members = ["client"]

[tool.uv.sources]
kyapay-a2a = { path = "../../kyapay_a2a", editable = true }

[tool.ruff]
target-version = "py313"

[dependency-groups]
lint = [
    "ruff>=0.13.1",
]
