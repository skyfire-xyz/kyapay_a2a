name: Dependabot Auto-merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.repository == 'skyfire-xyz/kyapay_a2a'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide eligibility
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_TYPE: ${{ steps.meta.outputs.dependency-type }}
        run: |
          eligible=false
          case "$UPDATE_TYPE" in
            version-update:semver-patch) eligible=true ;;
            version-update:semver-minor) eligible=true ;;
          esac
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "update=$UPDATE_TYPE dep=$DEP_TYPE eligible=$eligible"

      - name: Approve and enable auto-merge
        if: steps.gate.outputs.eligible == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --merge "$PR_URL"

      - name: Label held pull requests
        if: steps.gate.outputs.eligible != 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "$PR_URL" --add-label "needs-manual-review"
